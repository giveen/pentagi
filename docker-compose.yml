services:
  pentagi:
    image: local/pentagi:latest
    container_name: pentagi
    hostname: pentagi
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8443:8443" # Aligned to the internal SERVER_PORT
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      # =========================
      # UI & NETWORK (Fixes the 400 error & SearXNG clash)
      # =========================
      SERVER_PORT: "8443"
      SERVER_USE_SSL: "true"
      PUBLIC_URL: "https://localhost:8443"
      COOKIE_SIGNING_SALT: "Jeremy-5090-Secure-Salt-2026"

      # =========================
      # REQUIRED AUTH (Using sk- prefix to satisfy Go binary)
      # =========================
      OPENAI_API_KEY: "sk-local-dev-key-5090-rig"
 
      # =========================
      # LOCAL LLM (llama-swap)
      # =========================
      LLM_SERVER_URL: "http://host.docker.internal:8080/v1"
      LLM_SERVER_PROVIDER: ""
      LLM_SERVER_MODEL: "Llama-3.2-3B-Summarizer"
      LLM_SERVER_KEY: "dummy"
      LLM_SERVER_MAX_PARALLEL: "2"
      LLM_SERVER_MODEL_SWITCH_DELAY_MS: "5000"
      LLM_SERVER_TEST_PARALLEL_WORKERS: "1"

      # =========================
      # EMBEDDINGS
      # =========================
      EMBEDDING_PROVIDER: "openai"
      EMBEDDING_URL: "http://host.docker.internal:8080/v1"
      EMBEDDING_KEY: "dummy"
      EMBEDDING_MODEL: "Nomic-Embed-Text-v1.5"

      # =========================
      # DATABASE
      # =========================
      DATABASE_URL: "postgres://postgres:postgres@pgvector:5432/pentagidb?sslmode=disable"

      # =========================
      # DOCKER ACCESS
      # =========================
      DOCKER_HOST: "unix:///var/run/docker.sock"
      DOCKER_INSIDE: "true"
      DOCKER_NET_ADMIN: "true"
      DOCKER_SECCOMP_UNCONFINED: "true"
      DOCKER_APPARMOR_UNCONFINED: "true"
      DOCKER_DEFAULT_IMAGE_FOR_PENTEST: "local/kali-pentest:latest"

      # Clean out old cloud variables
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      OPEN_AI_KEY: "dummy"

      # =========================
      # SEARCH (PRIMARY: SEARXNG)
      # =========================
      DUCKDUCKGO_ENABLED: "false"
      SEARXNG_URL: "http://searxng-core:8081"
      SEARXNG_CATEGORIES: "general"
      SEARXNG_SAFESEARCH: "0"
      SEARXNG_TIMEOUT: "30"

    volumes:
      - pentagi-data:/opt/pentagi/data
      - pentagi-ssl:/opt/pentagi/ssl
      - /var/run/docker.sock:/var/run/docker.sock
    user: root:root # Critical for socket access
    networks:
      - pentagi-network
      - openui-default

  pgvector:
    image: vxcontrol/pgvector:latest
    container_name: pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pentagidb
    ports:
      - "127.0.0.1:8445:5432"
    volumes:
      - pentagi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pentagi-network

volumes:
  pentagi-data:
  pentagi-ssl:
  pentagi-postgres-data:

networks:
  pentagi-network:
    driver: bridge
  openui-default:
    external: true
    name: openui_default
