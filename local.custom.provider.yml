# Simple text completion — used for summarization and non-tool calls
simple:
  model: "Llama-3.2-3B-Summarizer"
  temperature: 0.1
  top_p: 0.9
  n: 1
  max_tokens: 3000

# JSON output without tool calling (e.g. tool-call fixer, structured extraction)
simple_json:
  model: "Llama-3.2-3B-Summarizer"
  temperature: 0.1
  top_p: 0.9
  n: 1
  max_tokens: 3000
  json: true

# Tool-calling agent roles: lower temperature + penalties reduce hallucinated
# string-wrapping of array fields and other schema deviations from small models.
primary_agent:
  model: "Llama-3.2-3B-Summarizer"
  temperature: 0.1
  top_p: 0.9
  n: 1
  max_tokens: 4000
  frequency_penalty: 0.2
  presence_penalty: 0.1

